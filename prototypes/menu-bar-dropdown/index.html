<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steve — Menu-Bar Dropdown Prototype</title>
  <style>
    /* ── CSS Variables ──────────────────────────────── */
    :root {
      --bg-page: #DCDCDC;
      --mb-bg: rgba(210,210,210,0.92);
      --mb-border: rgba(0,0,0,0.14);
      --mb-color: #000;
      --dd-bg: rgba(248,248,248,0.97);
      --dd-border: rgba(0,0,0,0.11);
      --dd-shadow: 0 4px 32px rgba(0,0,0,0.22), 0 1px 6px rgba(0,0,0,0.1);
      --t1: #1C1C1E;
      --t2: #636366;
      --t3: #8E8E93;
      --tlink: #007AFF;
      --sep: rgba(0,0,0,0.09);
      --hover: rgba(0,0,0,0.05);
      --btn-bg: rgba(0,0,0,0.06);
      --btn-border: rgba(0,0,0,0.10);
      --cr: #FF3B30;
      --cu: #FF9500;
      --cs: #8E8E93;
      --cc: #34C759;
    }
    [data-theme="dark"] {
      --bg-page: #1C1C1E;
      --mb-bg: rgba(34,34,36,0.96);
      --mb-border: rgba(255,255,255,0.08);
      --mb-color: #FFF;
      --dd-bg: rgba(44,44,46,0.98);
      --dd-border: rgba(255,255,255,0.08);
      --dd-shadow: 0 4px 32px rgba(0,0,0,0.55), 0 1px 6px rgba(0,0,0,0.28);
      --t1: #FFF;
      --t2: rgba(255,255,255,0.72);
      --t3: rgba(255,255,255,0.42);
      --tlink: #0A84FF;
      --sep: rgba(255,255,255,0.08);
      --hover: rgba(255,255,255,0.06);
      --btn-bg: rgba(255,255,255,0.08);
      --btn-border: rgba(255,255,255,0.10);
    }

    /* ── Reset ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page ───────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      background: #2B2B2B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 20px 96px;
      gap: 14px;
    }

    .proto-tag {
      color: rgba(255,255,255,0.28);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Controls ───────────────────────────────────── */
    .ctrl-strip {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px;
      padding: 5px 8px;
    }
    .ctrl-label {
      font-size: 10px;
      color: rgba(255,255,255,0.33);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding-right: 4px;
      white-space: nowrap;
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.11);
      color: rgba(255,255,255,0.52);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.88); }
    .ctrl-btn.active {
      background: rgba(255,255,255,0.17);
      border-color: rgba(255,255,255,0.26);
      color: #fff;
    }

    /* ── macOS Scene ────────────────────────────────── */
    .mac-scene {
      background: var(--bg-page);
      border-radius: 10px;
      overflow: visible;
      width: 680px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
    }

    /* ── Menu Bar ───────────────────────────────────── */
    .menubar {
      background: var(--mb-bg);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-radius: 10px 10px 0 0;
      border-bottom: 1px solid var(--mb-border);
      user-select: none;
      position: relative;
      z-index: 20;
    }
    .mb-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mb-color);
      font-size: 13px;
      font-weight: 500;
    }
    .mb-apple { font-size: 13px; opacity: 0.75; }
    .mb-app { font-weight: 600; }
    .mb-item { font-weight: 400; opacity: 0.68; cursor: default; }
    .mb-right {
      display: flex;
      align-items: center;
      gap: 1px;
    }
    .mb-sys {
      font-size: 11px;
      color: var(--mb-color);
      opacity: 0.58;
      padding: 1px 5px;
      cursor: default;
    }

    /* Steve icon button */
    .steve-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .steve-btn:hover { background: rgba(128,128,128,0.22); }
    .steve-ico {
      font-size: 14px;
      line-height: 1;
      color: var(--mb-color);
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }
    /* Icon states */
    [data-icon="idle"] .steve-ico      { color: var(--mb-color); opacity: 0.82; }
    [data-icon="checking"] .steve-ico  { color: var(--mb-color); animation: ico-pulse 1.5s ease-in-out infinite; }
    [data-icon="attention"] .steve-ico { color: #FF3B30; opacity: 1; }

    @keyframes ico-pulse {
      0%, 100% { opacity: 0.82; }
      50%       { opacity: 0.2;  }
    }

    /* ── Desktop ────────────────────────────────────── */
    .desktop {
      height: 60px;
      position: relative;
    }

    /* ── Dropdown popover ───────────────────────────── */
    #dropdown {
      position: absolute;
      top: 4px;
      right: 8px;
      width: 300px;
      background: var(--dd-bg);
      border: 1px solid var(--dd-border);
      border-radius: 12px;
      box-shadow: var(--dd-shadow);
      backdrop-filter: blur(30px) saturate(1.6);
      -webkit-backdrop-filter: blur(30px) saturate(1.6);
      overflow: hidden;
      font-size: 13px;
      color: var(--t1);
      z-index: 10;
    }
    /* Caret pointing up to the icon */
    #dropdown::before {
      content: '';
      position: absolute;
      top: -5px;
      right: 22px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 5px solid var(--dd-border);
    }
    #dropdown::after {
      content: '';
      position: absolute;
      top: -4px;
      right: 23px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 4px solid var(--dd-bg);
    }

    /* ── Shared row primitives ──────────────────────── */
    .dd-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      height: 26px;
      color: var(--t1);
      font-size: 13px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      overflow: hidden;
    }
    .dd-row:hover { background: var(--hover); }
    .dd-row .rn { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .dd-sep {
      height: 1px;
      background: var(--sep);
      margin: 3px 0;
    }
    .dd-bottom {
      border-top: 1px solid var(--sep);
      padding: 3px 0;
    }

    /* ══════════════════════════════════════════════════
       VARIANT A — Quiet
       Max density, minimum chrome.
       Colored dots identify state; groups separated by
       thin rules; status line is understated; Check is
       an inline text-link.
    ══════════════════════════════════════════════════ */
    #dropdown.var-a .va-head {
      display: flex;
      align-items: center;
      padding: 6px 14px 5px;
      gap: 8px;
      border-bottom: 1px solid var(--sep);
    }
    #dropdown.var-a .va-status {
      flex: 1;
      font-size: 11.5px;
      color: var(--t2);
    }
    #dropdown.var-a .va-cfu {
      background: none;
      border: none;
      color: var(--tlink);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #dropdown.var-a .va-cfu:hover { background: var(--hover); }
    .va-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #dropdown.var-a .va-grp-sep {
      height: 1px;
      background: var(--sep);
      margin: 2px 14px;
    }

    /* ══════════════════════════════════════════════════
       VARIANT B — Structured
       Three explicit zones: banner → CfU button → labeled
       sections. Left-bar accent on every skill row.
    ══════════════════════════════════════════════════ */
    #dropdown.var-b .vb-banner {
      padding: 9px 14px 8px;
      border-bottom: 1px solid var(--sep);
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }
    #dropdown.var-b .vb-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,59,48,0.12);
      color: #FF3B30;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 11px;
      font-weight: 700;
    }
    #dropdown.var-b .vb-body { flex: 1; }
    #dropdown.var-b .vb-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--t1);
    }
    #dropdown.var-b .vb-sub {
      font-size: 11px;
      color: var(--t2);
      margin-top: 1px;
    }
    #dropdown.var-b .vb-cfu {
      display: block;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--tlink);
      font-size: 12.5px;
      font-family: inherit;
      padding: 5px 0;
      margin: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      text-align: center;
      width: calc(100% - 28px);
      transition: background 0.1s;
    }
    #dropdown.var-b .vb-cfu:hover { background: rgba(0,122,255,0.09); }
    #dropdown.var-b .vb-sec {
      padding: 6px 14px 2px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    /* Left-bar accent rows */
    #dropdown.var-b .dd-row { padding-left: 20px; }
    #dropdown.var-b .dd-row::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 2px;
    }
    #dropdown.var-b .dd-row.s-removed::before { background: var(--cr); }
    #dropdown.var-b .dd-row.s-update::before  { background: var(--cu); }
    #dropdown.var-b .dd-row.s-skipped::before { background: var(--cs); }
    #dropdown.var-b .dd-row.s-current::before { background: transparent; }

    /* ══════════════════════════════════════════════════
       VARIANT C — Chips
       Status as pill-chips in the header; state badge on
       each row's trailing edge; no section labels — order
       + badge color carries the hierarchy.
    ══════════════════════════════════════════════════ */
    #dropdown.var-c .vc-chips {
      display: flex;
      align-items: center;
      padding: 7px 11px 6px;
      gap: 5px;
      border-bottom: 1px solid var(--sep);
      overflow: hidden;
    }
    .vc-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 6px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .vc-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .vc-chip.c-removed { background: rgba(255,59,48,0.10);  color: var(--cr); }
    .vc-chip.c-removed .vc-dot { background: var(--cr); }
    .vc-chip.c-update  { background: rgba(255,149,0,0.10);  color: var(--cu); }
    .vc-chip.c-update  .vc-dot { background: var(--cu); }
    .vc-chip.c-skipped { background: rgba(142,142,147,0.12); color: var(--cs); }
    .vc-chip.c-skipped .vc-dot { background: var(--cs); }
    #dropdown.var-c .vc-cfu {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--t3);
      font-size: 15px;
      cursor: pointer;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }
    #dropdown.var-c .vc-cfu:hover { background: var(--hover); color: var(--t1); }
    /* Trailing badge */
    .vc-badge {
      margin-left: auto;
      padding: 1px 7px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .vc-badge.c-removed { background: var(--cr); color: #fff; }
    .vc-badge.c-update  { background: var(--cu); color: #fff; }
    .vc-badge.c-skipped { background: rgba(142,142,147,0.18); color: var(--t2); }

    /* ── Floating switcher bar ──────────────────────── */
    .switcher {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18,18,18,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      z-index: 9999;
      user-select: none;
    }
    .sw-arrow {
      background: none;
      border: none;
      color: rgba(255,255,255,0.58);
      font-size: 16px;
      cursor: pointer;
      padding: 1px 6px;
      border-radius: 5px;
      line-height: 1;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }
    .sw-arrow:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .sw-label {
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      font-weight: 500;
      min-width: 116px;
      text-align: center;
    }
  </style>
</head>
<body>
  <p class="proto-tag">⚠ Throwaway prototype — Steve menu-bar dropdown · 3 variants</p>

  <!-- Controls -->
  <div class="ctrl-strip">
    <div class="ctrl-group">
      <span class="ctrl-label">Theme</span>
      <button class="ctrl-btn active" id="btn-theme-light" onclick="setTheme('light')">Light</button>
      <button class="ctrl-btn"        id="btn-theme-dark"  onclick="setTheme('dark')">Dark</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Icon state</span>
      <button class="ctrl-btn"        id="btn-icon-idle"      onclick="setIcon('idle')">Idle</button>
      <button class="ctrl-btn"        id="btn-icon-checking"  onclick="setIcon('checking')">Checking</button>
      <button class="ctrl-btn active" id="btn-icon-attention" onclick="setIcon('attention')">Attention</button>
    </div>
  </div>

  <!-- macOS scene -->
  <div class="mac-scene">
    <div class="menubar">
      <div class="mb-left">
        <span class="mb-apple">&#63743;</span>
        <span class="mb-app">Finder</span>
        <span class="mb-item">File</span>
        <span class="mb-item">Edit</span>
        <span class="mb-item">View</span>
        <span class="mb-item">Go</span>
        <span class="mb-item">Window</span>
      </div>
      <div class="mb-right">
        <span class="mb-sys">100%</span>
        <span class="mb-sys">&#9685;</span>
        <span class="mb-sys">Thu 3:00 PM</span>
        <!-- Steve icon -->
        <div class="steve-btn" id="steve-btn" data-icon="attention">
          <span class="steve-ico">↺</span>
        </div>
      </div>
    </div>
    <div class="desktop">
      <div id="dropdown" class="var-a"><!-- populated by JS --></div>
    </div>
  </div>

  <!-- Floating variant switcher -->
  <div class="switcher">
    <button class="sw-arrow" id="sw-prev">&#8592;</button>
    <span  class="sw-label"  id="sw-label">A — Quiet</span>
    <button class="sw-arrow" id="sw-next">&#8594;</button>
  </div>

  <script>
    /* ── Fake data ─────────────────────────────────── */
    const SKILLS = [
      { name: 'zoom-out',                    state: 'removed' },
      { name: 'grill-with-docs',             state: 'update'  },
      { name: 'tdd',                          state: 'update'  },
      { name: 'to-issues',                   state: 'update'  },
      { name: 'handoff',                     state: 'skipped' },
      { name: 'diagnose',                    state: 'current' },
      { name: 'improve-codebase-architecture', state: 'current' },
      { name: 'prototype',                   state: 'current' },
      { name: 'setup-skills',                state: 'current' },
      { name: 'to-prd',                      state: 'current' },
      { name: 'triage',                      state: 'current' },
    ];

    const STATE_ORDER  = ['removed', 'update', 'skipped', 'current'];
    const STATE_LABELS = {
      removed: 'Removed on origin',
      update:  'Update available',
      skipped: 'Skipped',
      current: 'Up to date',
    };
    const STATUS_LINE = '3 updates available · 1 removed · 1 skipped';

    const DOT_COLOR = {
      removed: 'var(--cr)',
      update:  'var(--cu)',
      skipped: 'var(--cs)',
      current: 'var(--cc)',
    };

    function groups() {
      const g = {};
      for (const s of STATE_ORDER) g[s] = [];
      for (const sk of SKILLS) g[sk.state].push(sk.name);
      for (const s of STATE_ORDER) g[s].sort();
      return g;
    }

    const rowTitle = s => (s === 'current' ? 'Opens skill on GitHub' : 'Opens Review window');

    /* ── Variant A: Quiet ──────────────────────────── */
    function renderA() {
      const g = groups();
      const active = STATE_ORDER.filter(s => g[s].length);
      let h = `
        <div class="va-head">
          <span class="va-status">${STATUS_LINE}</span>
          <button class="va-cfu">↺ Check</button>
        </div>`;
      for (let i = 0; i < active.length; i++) {
        const s = active[i];
        if (i > 0) h += `<div class="va-grp-sep"></div>`;
        for (const name of g[s]) {
          h += `<div class="dd-row" title="${rowTitle(s)}">
            <span class="va-dot" style="background:${DOT_COLOR[s]}"></span>
            <span class="rn">${name}</span>
          </div>`;
        }
      }
      h += `<div class="dd-bottom">
        <div class="dd-row">Settings…</div>
        <div class="dd-row">Quit Steve</div>
      </div>`;
      return h;
    }

    /* ── Variant B: Structured ─────────────────────── */
    function renderB() {
      const g = groups();
      const active = STATE_ORDER.filter(s => g[s].length);
      let h = `
        <div class="vb-banner">
          <div class="vb-icon">!</div>
          <div class="vb-body">
            <div class="vb-title">Attention required</div>
            <div class="vb-sub">${STATUS_LINE}</div>
          </div>
        </div>
        <button class="vb-cfu">↺ Check for updates</button>`;
      for (const s of active) {
        h += `<div class="vb-sec">${STATE_LABELS[s]}</div>`;
        for (const name of g[s]) {
          h += `<div class="dd-row s-${s}" title="${rowTitle(s)}">
            <span class="rn">${name}</span>
          </div>`;
        }
      }
      h += `<div class="dd-bottom">
        <div class="dd-row">Settings…</div>
        <div class="dd-row">Quit Steve</div>
      </div>`;
      return h;
    }

    /* ── Variant C: Chips ──────────────────────────── */
    function renderC() {
      const g = groups();
      const active = STATE_ORDER.filter(s => g[s].length);

      let h = `<div class="vc-chips">`;
      if (g.removed.length) h += `<span class="vc-chip c-removed"><span class="vc-dot"></span>${g.removed.length} removed</span>`;
      if (g.update.length)  h += `<span class="vc-chip c-update"><span class="vc-dot"></span>${g.update.length} updates</span>`;
      if (g.skipped.length) h += `<span class="vc-chip c-skipped"><span class="vc-dot"></span>${g.skipped.length} skipped</span>`;
      h += `<button class="vc-cfu" title="Check for updates">↺</button></div>`;

      for (let i = 0; i < active.length; i++) {
        const s = active[i];
        if (i > 0) h += `<div class="dd-sep"></div>`;
        for (const name of g[s]) {
          const badge = s !== 'current'
            ? `<span class="vc-badge c-${s}">${s === 'removed' ? 'removed' : s === 'update' ? 'update' : 'skipped'}</span>`
            : '';
          h += `<div class="dd-row" title="${rowTitle(s)}">
            <span class="rn">${name}</span>${badge}
          </div>`;
        }
      }
      h += `<div class="dd-bottom">
        <div class="dd-row">Settings…</div>
        <div class="dd-row">Quit Steve</div>
      </div>`;
      return h;
    }

    /* ── Variants registry ─────────────────────────── */
    const VARIANTS = [
      { key: 'A', name: 'Quiet',      cls: 'var-a', render: renderA },
      { key: 'B', name: 'Structured', cls: 'var-b', render: renderB },
      { key: 'C', name: 'Chips',      cls: 'var-c', render: renderC },
    ];

    /* ── Routing & state ───────────────────────────── */
    let idx = 0;

    function initIdx() {
      const k = new URLSearchParams(window.location.search).get('variant') ?? 'A';
      const i = VARIANTS.findIndex(v => v.key === k.toUpperCase());
      return i >= 0 ? i : 0;
    }

    function setVariant(i) {
      idx = ((i % VARIANTS.length) + VARIANTS.length) % VARIANTS.length;
      const v = VARIANTS[idx];
      const dd = document.getElementById('dropdown');
      dd.className = v.cls;
      dd.innerHTML = v.render();
      document.getElementById('sw-label').textContent = `${v.key} — ${v.name}`;
      const url = new URL(window.location.href);
      url.searchParams.set('variant', v.key);
      history.replaceState({}, '', url);
    }

    function setIcon(state) {
      document.getElementById('steve-btn').dataset.icon = state;
      ['idle','checking','attention'].forEach(s =>
        document.getElementById(`btn-icon-${s}`).classList.toggle('active', s === state)
      );
    }

    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      ['light','dark'].forEach(s =>
        document.getElementById(`btn-theme-${s}`).classList.toggle('active', s === t)
      );
    }

    /* ── Events ────────────────────────────────────── */
    document.getElementById('sw-prev').addEventListener('click', () => setVariant(idx - 1));
    document.getElementById('sw-next').addEventListener('click', () => setVariant(idx + 1));
    document.addEventListener('keydown', e => {
      const el = document.activeElement;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
      if (e.key === 'ArrowLeft')  { e.preventDefault(); setVariant(idx - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); setVariant(idx + 1); }
    });

    /* ── Init ──────────────────────────────────────── */
    idx = initIdx();
    setVariant(idx);
  </script>
</body>
</html>
